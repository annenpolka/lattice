[workspace]
resolver = "3"
members = [
  "crates/lattice-core",
  "crates/lattice-vel",
  "crates/lattice-wasm",
  "crates/lattice-engine",
  "crates/lattice-cli",
  "crates/lattice-media",
  "crates/lattice-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/annenpolka/lattice"
authors = ["Annenpolka"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

lattice-core = { path = "crates/lattice-core" }
lattice-engine = { path = "crates/lattice-engine" }
lattice-media = { path = "crates/lattice-media" }
lattice-vel = { path = "crates/lattice-vel" }
lattice-wasm = { path = "crates/lattice-wasm" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
