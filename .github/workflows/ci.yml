name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      # apt-get hangs behind unattended-upgrades; setup-ffmpeg fails parsing
      # johnvansickle's Linux readme. Use BtbN's GitHub static build instead.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=/tmp/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          gh release download latest --repo BtbN/FFmpeg-Builds \
            --pattern 'ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz' --dir /tmp
          sudo tar -xJf "$archive" -C /opt
          sudo install -m 0755 /opt/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 0755 /opt/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin/ffprobe /usr/local/bin/ffprobe
          ffmpeg -hide_banner -version | head -n 1
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Fixture font
        shell: bash
        run: |
          font="$PWD/fixtures/fonts/MPLUS1p-Regular.ttf"
          test -f "$font"
          echo "LATTICE_FONT=$font" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pin Quint. Do not install @informalsystems/quint@latest.
      - name: Quint specs
        env:
          QUINT_VERSION: "0.32.0"
        shell: bash
        run: |
          set -euo pipefail
          QUINT="npx --yes @informalsystems/quint@${QUINT_VERSION}"
          for spec in spec/*.qnt; do
            echo "::group::parse ${spec}"
            ${QUINT} parse "${spec}"
            echo "::endgroup::"
            echo "::group::typecheck ${spec}"
            ${QUINT} typecheck "${spec}"
            echo "::endgroup::"
            echo "::group::test ${spec}"
            ${QUINT} test "${spec}"
            echo "::endgroup::"
            echo "::group::run ${spec}"
            ${QUINT} run "${spec}" --max-steps=30 --invariant=inv
            echo "::endgroup::"
          done
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Studio window smoke (`scripts/studio-smoke.ps1`) stays a local desktop
      # gate. GitHub-hosted Windows is not a reliable interactive GPU/DWM session.
      - name: test
        run: cargo test --workspace
