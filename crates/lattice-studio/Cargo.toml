[package]
name = "lattice-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPUI Studio shell. Engine client; compile semantics stay in lattice-engine."

[[bin]]
name = "lattice-studio"
path = "src/main.rs"
required-features = ["window"]

[features]
default = ["window"]
window = ["dep:gpui"]

[dependencies]
gpui = { version = "0.2.2", optional = true }
lattice-engine.workspace = true

[lints]
workspace = true
