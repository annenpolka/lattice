[package]
name = "lattice-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lowering registry. Wasmtime hosts freeze/title/caption WIT; other words stay in-process until they move."

[dependencies]
lattice-core.workspace = true
thiserror.workspace = true
wasmtime = { version = "36", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "gc-drc",
] }
wasmtime-wasi = { version = "36", default-features = false, features = ["preview1"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
